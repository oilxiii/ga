<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#06111d">
  <title>Gundam Assemble — Sleeping Leviathan</title>
  <link rel="stylesheet" href="styles.css?v=17">
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-kicker">GUNDAM ASSEMBLE // ONLINE</span>
      </div>
      <section class="match-state" aria-label="สถานะเกม">
        <div class="score fed"><span>E.F.S.F.</span><strong id="fed-vp">0</strong><small>VP</small></div>
        <div class="round-state"><span id="phase-label">PHASE 1</span><strong id="round-label">ROUND 1 / 10</strong></div>
        <div class="score zeon"><small>VP</small><strong id="zeon-vp">0</strong><span>ZEON</span></div>
      </section>
      <button id="restart-btn" class="icon-btn" aria-label="เริ่มเกมใหม่" title="เริ่มเกมใหม่">↻</button>
    </header>

    <section class="timeline-panel" aria-label="Timeline 1 ถึง 10">
      <div class="timeline-title"><span id="timeline-phase">PHASE 1</span></div>
      <div id="timeline" class="timeline"></div>
    </section>

    <section class="game-grid">
      <div class="battlefield-panel">
        <div class="battlefield-head">
          <div><span class="eyebrow">TACTICAL MAP</span><strong>Sleeping Leviathan</strong></div>
          <div class="board-tools">
            <div class="legend" aria-label="คำอธิบายแผนที่">
            <span><i class="e0"></i>ระดับ 0</span><span><i class="e1"></i>ระดับ 1</span><span><i class="e2"></i>ระดับ 2</span>
            </div>
            <button id="rules-btn" class="text-btn">กติกาย่อ</button>
          </div>
        </div>
        <div id="board-wrap" class="board-wrap">
          <svg id="board" viewBox="0 0 780 650" role="application" aria-label="กระดาน Hex Sleeping Leviathan"></svg>
          <section id="active-hud" class="active-hud" aria-live="polite"></section>
          <nav id="command-menu" class="unit-command-menu" aria-label="คำสั่งยูนิต"></nav>
          <section class="combat-feed board-feed">
            <div id="dice-tray" class="dice-tray" aria-live="polite"></div>
            <ol id="battle-log"></ol>
          </section>
        </div>
      </div>
    </section>

    <section id="tactics-panel" class="tactics-panel">
      <div class="tactics-title">
        <div><span class="eyebrow">TACTICS DECK</span><strong id="hand-title">—</strong></div>
        <small>สุ่ม 3 ใบจาก 9 ใบใหม่เมื่อเริ่มแต่ละ Phase</small>
      </div>
      <div id="tactic-hand" class="tactic-hand"></div>
    </section>
  </main>

  <div id="pass-overlay" class="overlay show" role="dialog" aria-modal="true">
    <div class="pass-card">
      <span class="eyebrow">HOT-SEAT HANDOFF</span>
      <h2 id="pass-title">เตรียมเริ่มการรบ</h2>
      <p id="pass-copy">ส่งเครื่องให้ผู้เล่นฝ่ายที่กำลังจะ Activate</p>
      <button id="pass-btn" class="primary-btn">เปิดคำสั่ง</button>
    </div>
  </div>

  <div id="modal" class="overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-card">
      <button id="modal-close" class="modal-close" aria-label="ปิด">×</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="data.js?v=17"></script>
  <script src="engine.js?v=17"></script>
  <script src="game.js?v=17"></script>
</body>
</html>
